# Prioritized A/B: QSA width clamp (before / after). Exact flag and clamp value are TODO.
name: qsa-width-clamp
description: One-fix A/B for the QSA width clamp. Logs should show QSA_GRAPH width=... when active.
profile: custom
kind: comparison
endpoint:
  base_url: http://127.0.0.1:8000/v1  # TODO
  api_key_env: OPENAI_API_KEY
  model: TODO-served-model-name
server:
  image: <vllm-xpu-image>:<tag>  # placeholder; TODO: pin the parent image
  image_digest: TODO-image-digest
  container_name: vllm-bench-width-clamp
  source_commit: TODO-server-source-commit
  manage_container: false
  attention_requested: qsa
  kv_format: int8_k_int4_v
  env:
    K8V4_QSA: "1"
  graph:
    mode: FULL_DECODE_ONLY
    per_gpu: true
    capture_sizes: [7, 14, 21, 28, 35, 42, 49, 56]
  speculative:
    method: mtp
    num_speculative_tokens: 6
  max_num_seqs: 8
hardware:
  tensor_parallel: 2
access:
  mode: local  # TODO
safety:
  hold_minutes: 180
  allowed_containers: [vllm-bench-width-clamp-before, vllm-bench-width-clamp-after]
prompts:
  types: [code_edits, long_form, multi_turn_chat]
  seed: 20261111
ladder:
  # Progressive: session 1 grows through every context rung, then users join.
  shape: session1_then_join
  context_rungs_tokens: auto  # 8K, 32K, 64K, 131K, 196K, 262K, ... up to the server max_model_len
  concurrency_steps: [1, 2, 4, 8]
  load_modes: [closed_all_decoding]
  output_tokens_per_rung: 128
  warmup: {tokens: 16, requests: 1}
  grow_monotonically: true
  boot_once: true
# Each variant runs against ITS OWN booted container. env / launch_args / image
# below are what that container is expected to run: they are checked against
# `docker inspect` at preflight (NOT_AS_LABELED on mismatch), never applied.
# Variants here share one endpoint, so run them one at a time:
#   bench run SPEC --variant NAME            (boot that variant first), or
#   bench run SPEC --pause-between-variants  (prompts you to reboot between them),
# or give each variant its own endpoint: {base_url} (metrics_url / health_url follow it unless set).
variants:
  - name: before
    container_name: vllm-bench-width-clamp-before
    notes: "TODO: width clamp disabled / parent commit"
    env:
      K8V4_QSA: "1"
      # TODO: the exact env or launch flag that disables the clamp
  - name: after
    container_name: vllm-bench-width-clamp-after
    notes: "TODO: width clamp enabled; confirm the logged QSA_GRAPH width= value (65536 has been seen)"
    env:
      K8V4_QSA: "1"
      # TODO: e.g. QSA_WIDTH=65536 or whatever the fix actually is
notes:
  - Classify path from logs. A clamp that silently falls back is not a comparable QSA win.
