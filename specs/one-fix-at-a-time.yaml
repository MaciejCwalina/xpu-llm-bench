# Template for one-fix-at-a-time A/B ladders. Duplicate a variant pair per fix.
# Each variant boots once. Do not restart vLLM to change concurrency.
name: one-fix-at-a-time
description: >
  Template. Fill in image/commit and the exact env or launch-arg delta for one
  speed fix, run, then `bench compare` the two results JSONL files. Repeat
  per fix; never combine fixes in this template.
profile: custom
kind: template
endpoint:
  base_url: http://127.0.0.1:8000/v1  # TODO
  api_key_env: OPENAI_API_KEY
  model: TODO-served-model-name
server:
  image: TODO-parent-image
  image_digest: TODO-image-digest
  container_name: vllm-bench-one-fix
  source_commit: TODO-parent-commit
  manage_container: false
  attention_requested: qsa
  kv_format: int8_k_int4_v
  env:
    K8V4_QSA: "1"
  graph:
    mode: FULL_DECODE_ONLY
    per_gpu: false
    capture_sizes: [7, 14, 21, 28, 35, 42, 49, 56]
  speculative:
    method: mtp
    num_speculative_tokens: 6
  max_num_seqs: 8
hardware:
  tensor_parallel: 2
access:
  mode: local  # TODO
safety:
  hold_minutes: 180
  allowed_containers: [vllm-bench-one-fix-before, vllm-bench-one-fix-after]
prompts:
  types: [code_edits, long_form, multi_turn_chat]
  seed: 20261111
ladder:
  # Progressive: session 1 grows through every context rung, then users join.
  shape: session1_then_join
  context_rungs_tokens: [8192, 32768, 131072]
  concurrency_steps: [1, 2, 4, 8]
  load_modes: [closed_all_decoding]
  output_tokens_per_rung: 128
  warmup: {tokens: 16, requests: 1}
  grow_monotonically: true
  boot_once: true
# Each variant runs against ITS OWN booted container. env / launch_args / image
# below are what that container is expected to run: they are checked against
# `docker inspect` at preflight (NOT_AS_LABELED on mismatch), never applied.
# Variants here share one endpoint, so run them one at a time:
#   bench run SPEC --variant NAME            (boot that variant first), or
#   bench run SPEC --pause-between-variants  (prompts you to reboot between them),
# or give each variant its own endpoint: {base_url} (metrics_url / health_url follow it unless set).
variants:
  - name: before
    container_name: vllm-bench-one-fix-before
    notes: "TODO: parent commit / fix disabled"
  - name: after
    container_name: vllm-bench-one-fix-after
    notes: "TODO: name the single fix (e.g. per-GPU graph capture, batched indexer scans, seq_lens on device, prefill debug print off, MTP-6 crash fix, DFlash2 packed window, pooled-int8)"
    env:
      # TODO: only the flags that enable this one fix
      K8V4_QSA: "1"
notes:
  - One change per A/B. If the after image also contains unrelated commits, the rows are not a clean one-fix comparison.
  - Use the same prompt seed and types on both sides.
