# Example site config. Copy to <repo root>/bench-site.local.yaml (gitignored),
# or to ~/.config/xpu-llm-bench/site.yaml, or point $XPU_BENCH_SITE at it, and
# replace EVERY <...> value with the real one for your bench host. Never commit
# the real file. The current directory is NOT searched.
#
# The loader rejects any value that still contains <...>, TODO, example or
# changeme, and requires host, protected_containers and forbidden_ports.
# `bench plan` and `bench run` print which site file they loaded.
#
# Everything here only ADDS protection to the built-in neutral defaults
# (container "vllm-production", port 8001, CI-runner name patterns).

# Display name of the bench host (written to results as hardware.host).
host: <bench-host>
# ssh target when a spec uses access.mode: ssh (an ~/.ssh/config alias is best).
ssh_host: <bench-host>

# Exact names of production containers the runner must never touch.
protected_containers:
  - <production-vllm-container>
# Case-insensitive regexes for other protected services (gateways, git hosting, ...).
protected_patterns:
  - <protected-service-pattern>
# Host ports of production endpoints. Endpoints and test containers bound to
# these ports are refused.
forbidden_ports:
  - <production-port>

# Optional: path of a `bench-hold` style lock CLI on the bench host
# (status / acquire / renew / release). Leave null if you have none; runs then
# go ahead without a hold (bench run prints a warning).
hold_command: null
# Optional operator quiet-hold file (read only; an active quiet hold blocks runs).
quiet_hold_file: null

# Optional: IANA zone for the second, human-readable timestamp in results
# (started_local / finished_local). Default: $XPU_BENCH_TZ, else system local.
timezone: null

# Optional: facts about the bench host, used when a spec does not set them.
# Unset GPU facts skip the planner's GPU fit check with a warning.
hardware: {}
#   gpu_model: <gpu-model>
#   gpu_count: 2
#   gpu_mem_gib: 24
#   tensor_parallel: 2
#   mem_available_floor_gib: 2.0   # abort a run when MemAvailable reaches this

# Optional: planner estimates (see docs/METHODOLOGY.md, "Planner").
planner: {}
#   host_bytes_per_token: 65536     # host RAM growth per live token (ESTIMATE)
#   assumed_weight_gib: 18.0       # model weights per GPU (ESTIMATE)
