[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xpu-llm-bench"
version = "0.1.0"
description = "Consistent, comparable LLM-serving benchmark runs for vLLM on Intel XPU (MTP / QSA / K8V4 / DFlash2)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "xpu-llm-bench contributors" }]
dependencies = [
  "pydantic>=2.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.20",
  "ruff>=0.6",
]

[project.scripts]
bench = "xpu_llm_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
